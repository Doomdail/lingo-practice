name: Checks and ZIP

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: for file in *.js; do node --check "$file"; done
      - name: Build ZIP
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          files = (
              "manifest.json", "background.js", "youtube.js", "exercise.js", "data.js",
              "content.js", "i18n.js", "styles.css", "library.html", "library.js", "library.css",
              "_locales/en/messages.json", "_locales/ru/messages.json",
              *(f"icons/icon{size}.png" for size in (16, 32, 48, 128)),
              "README.md", "README.ru.md", "PRIVACY.md", "LICENSE",
          )
          version = json.loads(Path("manifest.json").read_text(encoding="utf-8"))["version"]
          if not re.fullmatch(r"\d+(?:\.\d+){0,3}", version):
              raise ValueError("Invalid manifest version")
          output = Path("dist")
          output.mkdir(exist_ok=True)
          archive = output / f"lingo-practice-{version}.zip"
          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as zipped:
              for name in files:
                  zipped.write(name, name)
          with ZipFile(archive) as zipped:
              assert len(zipped.namelist()) == len(files)
              assert set(zipped.namelist()) == set(files)
              assert zipped.testzip() is None
          print(archive)
          PY
      - name: Upload installable ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/lingo-practice-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
