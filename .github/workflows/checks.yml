name: Checks and ZIP

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # The update test loads the real v0.4.2 tag.
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check syntax and unit tests
        run: |
          for file in *.js; do node --check "$file"; done
          python -m compileall -q scripts tests
          node --test
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.59.0
          python -m playwright install --with-deps chromium
      - name: Verify ZIP and update from 0.4.2
        run: python tests/update-smoke.py
      - name: Build ZIP
        run: python scripts/package_release.py
      - name: Upload installable ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: dist/lingo-practice-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
